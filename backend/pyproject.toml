[tool.poetry]
name = "authentication-service"
version = "0.1.0"
description = "Central Authentication Service - Session, JWT, API Key auth"
authors = ["K Services"]
readme = "README.md"
packages = [
    { include = "components" },
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.14"

# FastAPI + ASGI
fastapi = "^0.128"
uvicorn = { extras = ["standard"], version = "^0.40" }
gunicorn = "^25.0"

# Pydantic
pydantic = { extras = ["email"], version = "^2.12" }
pydantic-settings = "^2.12"

# System
psutil = "^7.0"

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
sqlmodel = "^0.0.33"
asyncpg = "^0.30"
alembic = "^1.18"
psycopg = { extras = ["binary"], version = "^3.3" }

# Redis
redis = { extras = ["hiredis"], version = "^7.1" }

# Logging
structlog = "^25.5"

# UUID
uuid-utils = "^0.10"

# HTTP Client
aiohttp = "^3.11"

# Email
aiosmtplib = "^5.1"
mjml = "^0.12"

# gRPC
grpcio = "^1.70"
grpcio-tools = "^1.70"

# JWT
pyjwt = "^2.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
pytest-cov = "^7.0"
httpx = "^0.28"
ruff = "^0.9"
mypy = "^1.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["components", "src"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "grpcio.*",
    "grpc.*",
    "mjml.*",
    "uuid_utils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
